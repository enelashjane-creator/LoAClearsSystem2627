<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | LOAClears</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 20%, rgba(244,196,0,.22), transparent 28%),
            radial-gradient(circle at 85% 80%, rgba(244,196,0,.18), transparent 30%),
            linear-gradient(135deg, #092d68 0%, #064a91 48%, #061a3d 100%);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }
    .wrapper {
        width: min(1050px, 100%);
        min-height: 610px;
        display: grid;
        grid-template-columns: 42% 58%;
        background: rgba(4,25,59,.96);
        border: 1px solid rgba(244,196,0,.35);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(0,0,0,.38);
    }
    .brand {
        background: linear-gradient(145deg, rgba(244,196,0,.18), rgba(7,44,94,.55) 45%, rgba(3,20,48,.9));
        padding: 45px 38px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        border-right: 1px solid rgba(244,196,0,.22);
    }
    .logo {
        width: 190px;
        height: 190px;
        object-fit: contain;
        margin-bottom: 25px;
        display: block;
    }
    .brand-name {
        font-size: 42px;
        font-weight: 800;
        color: #f4c400;
    }
    .brand-subtitle {
        margin-top: 5px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 3px;
    }
    .school {
        margin-top: 20px;
        font-size: 18px;
        font-weight: 700;
        color: #ffe45c;
    }
    .description {
        margin-top: 25px;
        max-width: 330px;
        color: #dbe7f8;
        font-size: 14px;
        line-height: 1.7;
    }
    .authorized {
        margin-top: 25px;
        padding: 10px 18px;
        border-radius: 30px;
        background: rgba(244,196,0,.12);
        border: 1px solid rgba(244,196,0,.35);
        color: #f4c400;
        font-size: 12px;
        font-weight: 700;
    }
    .panel {
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: rgba(255,255,255,.035);
    }
    h1 {
        font-size: 31px;
        margin-bottom: 7px;
    }
    .subtitle {
        color: #b9cce7;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 30px;
    }
    .group {
        margin-bottom: 18px;
    }
    label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
    }
    input {
        width: 100%;
        height: 50px;
        padding: 0 15px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,.16);
        background: rgba(2,18,43,.75);
        color: #ffffff;
        font-size: 14px;
        outline: none;
    }
    input:focus {
        border-color: #f4c400;
        box-shadow: 0 0 0 3px rgba(244,196,0,.10);
    }
    input::placeholder {
        color: #8195b3;
    }
    .password {
        position: relative;
    }
    .password input {
        padding-right: 55px;
    }
    .eye {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #f4c400;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .message {
        display: none;
        margin: 5px 0 15px;
        padding: 11px 14px;
        border-radius: 9px;
        font-size: 13px;
        line-height: 1.5;
    }
    .message.error {
        display: block;
        background: rgba(220,53,69,.14);
        border: 1px solid rgba(220,53,69,.4);
        color: #ffb4bd;
    }
    .message.success {
        display: block;
        background: rgba(25,135,84,.15);
        border: 1px solid rgba(25,135,84,.4);
        color: #9ff0c5;
    }
    .button {
        width: 100%;
        height: 51px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, #f4c400, #ffd83d);
        color: #071b3c;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
    }
    .back {
        text-align: center;
        margin-top: 22px;
        color: #aebfd8;
        font-size: 13px;
    }
    .back a {
        color: #f4c400;
        font-weight: 800;
        text-decoration: none;
    }
    @media (max-width: 850px) {
        body { padding: 15px; }
        .wrapper { grid-template-columns: 1fr; min-height: auto; }
        .brand { padding: 30px 20px; border-right: 0; border-bottom: 1px solid rgba(244,196,0,.22); }
        .logo { width: 125px; height: 125px; }
        .panel { padding: 30px 25px; }
    }
</style>
</head>
<body>
<div class="wrapper">
    <div class="brand">
        <img class="logo" src="assets/loalogoclears.png" alt="Lyceum of Alabang Logo">
        <div class="brand-name">LOAClears</div>
        <div class="brand-subtitle">DIGITAL CLEARANCE SYSTEM</div>
        <div class="school">🏫 Lyceum of Alabang</div>
        <div class="description">
            Reset your student account password using
            your registered username and student number.
        </div>
        <div class="authorized">🔐 FOR LYCEUM OF ALABANG STUDENTS</div>
    </div>
    <div class="panel">
        <h1>Forgot Password?</h1>
        <div class="subtitle">
            Enter your account information and create a new password.
        </div>
        <form id="forgotForm">
            <div class="group">
                <label for="username">👤 Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="off" required>
            </div>
            <div class="group">
                <label for="studentNumber">🪪 Student Number / LRN</label>
                <input type="text" id="studentNumber" placeholder="Enter your student number" autocomplete="off" required>
            </div>
            <div class="group">
                <label for="newPassword">🔑 New Password</label>
                <div class="password">
                    <input type="password" id="newPassword" placeholder="Enter your new password" autocomplete="new-password" required>
                    <button type="button" class="eye" id="showPassword">👁️</button>
                </div>
            </div>
            <div class="group">
                <label for="confirmPassword">🔐 Confirm New Password</label>
                <div class="password">
                    <input type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password" required>
                    <button type="button" class="eye" id="showConfirmPassword">👁️</button>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="button">🔐 RESET PASSWORD</button>
        </form>
        <div class="back">
            Remembered your password?
            <a href="./login.html">Back to Login</a>
        </div>
    </div>
</div>
<script>
function togglePassword(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
    } else {
        input.type = "password";
        btn.textContent = "👁️";
    }
}
document.getElementById("showPassword").addEventListener("click", function(){
    togglePassword("newPassword", "showPassword");
});
document.getElementById("showConfirmPassword").addEventListener("click", function(){
    togglePassword("confirmPassword", "showConfirmPassword");
});
document.getElementById("forgotForm").addEventListener("submit", function(e){
    e.preventDefault();
    const msg = document.getElementById("message");
    const user = document.getElementById("username").value.trim();
    const snum = document.getElementById("studentNumber").value.trim();
    const p1 = document.getElementById("newPassword").value;
    const p2 = document.getElementById("confirmPassword").value;
    msg.className = "message";
    if(!user || !snum || !p1 || !p2){
        msg.className = "message error";
        msg.textContent = "Please complete all required fields.";
        return;
    }
    if(p1.length < 6){
        msg.className = "message error";
        msg.textContent = "Password must contain at least 6 characters.";
        return;
    }
    if(p1 !== p2){
        msg.className = "message error";
        msg.textContent = "New passwords do not match.";
        return;
    }
    msg.className = "message success";
    msg.textContent = "Password reset successfully! Redirecting to Login...";
    setTimeout(function(){
        window.location.href = "./login.html";
    }, 1500);
});
</script>
</body>
</html>
