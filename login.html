<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOAClears | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 15% 20%, rgba(244, 196, 0, 0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(244, 196, 0, 0.13), transparent 32%),
                linear-gradient(135deg, #020b1d, #06152f 45%, #092650);
            padding: 25px;
            color: white;
        }
        .login-card {
            width: min(950px, 100%);
            min-height: 545px;
            background: rgba(6, 21, 47, 0.96);
            border: 1px solid rgba(244, 196, 0, 0.28);
            border-radius: 22px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5),
                0 0 35px rgba(244, 196, 0, 0.08);
            padding: 38px 65px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(244, 196, 0, 0.07);
            filter: blur(80px);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            pointer-events: none;
        }
        .login-card::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(15, 74, 150, 0.20);
            filter: blur(90px);
            border-radius: 50%;
            right: -100px;
            bottom: -120px;
            pointer-events: none;
        }
        .content {
            width: 100%;
            max-width: 820px;
            margin: auto;
            position: relative;
            z-index: 2;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo {
            width: 105px;
            height: 105px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px;
            filter: drop-shadow(0 0 12px rgba(244, 196, 0, 0.25));
        }
        .school-name {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.6px;
            color: #dbe4f2;
            text-transform: uppercase;
        }
        .system-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .system-title h1 {
            color: #f4c400;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow:
                0 0 5px rgba(244, 196, 0, 0.7),
                0 0 16px rgba(244, 196, 0, 0.35);
        }
        .system-title p {
            margin-top: 3px;
            color: #cbd6e8;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
        }
        .authorized {
            text-align: center;
            margin-bottom: 22px;
            font-size: 11px;
            color: #9fb0c9;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .authorized span {
            color: #f4c400;
            font-weight: 700;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 17px;
        }
        .form-group {
            width: 100%;
        }
        label {
            display: block;
            color: #d9e2ef;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }
        .input-wrapper,
        .select-wrapper {
            position: relative;
            width: 100%;
        }
        input,
        select {
            width: 100%;
            height: 48px;
            border: 1px solid #2c4366;
            border-radius: 10px;
            background: #081a38;
            color: white;
            outline: none;
            padding: 0 15px;
            font-size: 14px;
            transition: 0.2s ease;
        }
        input::placeholder {
            color: #71829b;
        }
        input:focus,
        select:focus {
            border-color: #f4c400;
            box-shadow: 0 0 0 3px rgba(244, 196, 0, 0.08);
        }
        select {
            cursor: pointer;
            appearance: auto;
        }
        select option {
            background: #081a38;
            color: white;
        }
        .password-input {
            padding-right: 52px;
        }
        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border: none;
            background: transparent;
            color: #b8c6d9;
            cursor: pointer;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }
        .password-toggle:hover {
            background: rgba(244, 196, 0, 0.08);
            color: #f4c400;
        }
        .role-group {
            margin-bottom: 17px;
        }
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -4px;
            margin-bottom: 18px;
        }
        .forgot-link {
            color: #f4c400;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s ease;
        }
        .forgot-link:hover {
            color: #ffe36b;
            text-decoration: underline;
        }
        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f4c400, #dcae00);
            color: #06152f;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 8px 20px rgba(244, 196, 0, 0.16);
        }
        .login-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #ffd21c, #f4c400);
            box-shadow: 0 10px 25px rgba(244, 196, 0, 0.25);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .register-text {
            text-align: center;
            margin-top: 18px;
            color: #899ab2;
            font-size: 12px;
        }
        .register-link {
            color: #f4c400;
            text-decoration: none;
            font-weight: 700;
        }
        .register-link:hover {
            text-decoration: underline;
            color: #ffe36b;
        }
        .footer {
            text-align: center;
            margin-top: 22px;
            color: #61738f;
            font-size: 10px;
            letter-spacing: 0.4px;
        }
        .error-message {
            display: none;
            margin-bottom: 14px;
            padding: 10px 13px;
            border-radius: 8px;
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.35);
            color: #ff9da7;
            font-size: 12px;
            text-align: center;
        }
        .success-message {
            display: none;
            margin-bottom: 14px;
            padding: 10px 13px;
            border-radius: 8px;
            background: rgba(25, 135, 84, 0.12);
            border: 1px solid rgba(25, 135, 84, 0.35);
            color: #8ce0b5;
            font-size: 12px;
            text-align: center;
        }
        @media (max-width: 720px) {
            body {
                padding: 15px;
            }
            .login-card {
                padding: 30px 22px 22px;
                min-height: auto;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .system-title h1 {
                font-size: 30px;
            }
            .system-title p {
                font-size: 10px;
                letter-spacing: 2px;
            }
            .logo {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="content">
            <div class="logo-area">
                <img
                    src="assets/loalogoclears.png"
                    alt="Lyceum of Alabang Logo"
                    class="logo"
                >
                <div class="school-name">
                    Lyceum of Alabang
                </div>
            </div>
            <div class="system-title">
                <h1>LOAClears</h1>
                <p>DIGITAL CLEARANCE SYSTEM</p>
            </div>
            <div class="authorized">
                🔐
                <span>AUTHORIZED USERS ONLY</span>
                &nbsp;•&nbsp;
                Grade 12 ICT Students & Authorized School Personnel
            </div>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <form id="loginForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">👤 Username</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">🔒 Password</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="password-input"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                onclick="togglePasswordVisibility()"
                                aria-label="Show password"
                            >👁️</button>
                        </div>
                    </div>
                </div>
                <div class="form-group role-group">
                    <label for="role">🎓 Select Role</label>
                    <div class="select-wrapper">
                        <select id="role" name="role" required>
                            <option value="">Select your role</option>
                            <option value="student">Student</option>
                            <option value="teacher">Subject Teacher</option>
                            <option value="library">Library</option>
                            <option value="property">Property / Facilities</option>
                            <option value="osa">Office of Student Affairs</option>
                            <option value="finance">Cashier / Finance</option>
                            <option value="strandHead">Strand Head</option>
                            <option value="adviser">Class Adviser</option>
                            <option value="registrar">Registrar</option>
                            <option value="principal">Principal</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                </div>
                <div class="forgot-row">
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">LOGIN TO LOACLEARS</button>
            </form>
            <div class="register-text">
                Don't have an account?
                <a href="register.html" class="register-link">Create Account</a>
            </div>
            <div class="footer">
                © 2026 Lyceum of Alabang • LOAClears Digital Clearance System
            </div>
        </div>
    </div>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const toggleButton = document.getElementById("passwordToggle");
            if (!passwordInput || !toggleButton) return;
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "🙈";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "👁️";
                toggleButton.setAttribute("aria-label", "Show password");
            }
        }
    </script>
    <script>
        function showLoginError(message) {
            const errorBox = document.getElementById("errorMessage");
            const successBox = document.getElementById("successMessage");
            if (successBox) successBox.style.display = "none";
            if (errorBox) {
                errorBox.textContent = message;
                errorBox.style.display = "block";
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");
            if (!loginForm) return;
            loginForm.addEventListener("submit", function (event) {
                event.preventDefault();
                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value;
                const role = document.getElementById("role").value;
                if (!username) {
                    showLoginError("Please enter your username.");
                    return;
                }
                if (!password) {
                    showLoginError("Please enter your password.");
                    return;
                }
                if (!role) {
                    showLoginError("Please select your role.");
                    return;
                }
                showLoginError("Login system not connected. Check js/auth.js.");
            });
        });
    </script>
</body>
</html>
